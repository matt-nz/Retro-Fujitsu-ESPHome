# Fujitsu AOT30L / ART30RL (old ducted units, 3-wire LIN wired remote) -- ESP32 "Master Controller".
#
# The ESP32 plus a LIN transceiver (TJA1021, "linttl3") REPLACES the wired remote: it polls the unit continuously and
# turns Home Assistant climate commands into the remote's messages. The wired remote must be FULLY disconnected (all
# three wires) while the Master Controller is on. See docs/aot30-master-controller.md.
#
# Not for the newer ART30LUAK-style units that speak the 8-byte frame protocol: use retrofujitsu.yaml and the
# fujitsu_climate component for those.

esphome:
  name: aircon
  friendly_name: "Aircon"
  on_boot:
    priority: 600
    then:
      - logger.log: "Fujitsu AOT30L/ART30RL - master controller firmware"
      - light.turn_on:
          id: status_light
          brightness: 100%
          effect: "Boot Pattern"

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Aircon-Fallback"
    password: "fallback123"

  on_connect:
    - logger.log: "WiFi Connected!"
    - light.turn_on:
        id: status_light
        brightness: 100%
        effect: "WiFi Connected"

  on_disconnect:
    - logger.log: "WiFi Disconnected!"
    - light.turn_on:
        id: status_light
        brightness: 100%
        effect: "WiFi Error"

captive_portal:

api:
  on_client_connected:
    - logger.log: "Home Assistant Connected!"
    - light.turn_on:
        id: status_light
        brightness: 100%
        effect: "HA Connected"

  on_client_disconnected:
    - logger.log: "Home Assistant Disconnected!"
    - light.turn_on:
        id: status_light
        brightness: 100%
        effect: "HA Disconnected"

ota:
  - platform: esphome

# If the device crashes on boot 10 times in a row it enters a minimal mode (WiFi + OTA only).
safe_mode:
  num_attempts: 10
  reboot_timeout: 10min

external_components:
  - source:
      type: local
      path: components
    components: [ fujitsu_aot30 ]
    refresh: 0s

# rx_pin = GPIO16 (from the transceiver's TXD pin), tx_pin = GPIO17 (to the transceiver's RXD pin).
# debug: true logs every received byte ("RX raw" lines, for tools/decode_timeline.py); set it to false for quieter logs.
climate:
  - platform: fujitsu_aot30
    name: "Fujitsu Heat Pump"
    id: fujitsu_hp
    rx_pin: 16
    tx_pin: 17
    debug: true

# Status LED with patterns
light:
  - platform: status_led
    id: status_light
    name: "Status LED"
    internal: true
    pin:
      number: GPIO2
      inverted: false
    effects:
      - strobe:
          name: "Boot Pattern"
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms

      - strobe:
          name: "WiFi Connected"
          colors:
            - state: true
              duration: 100ms
            - state: false
              duration: 1900ms

      - strobe:
          name: "WiFi Error"
          colors:
            - state: true
              duration: 200ms
            - state: false
              duration: 200ms

      - strobe:
          name: "HA Connected"
          colors:
            - state: true
              duration: 500ms
            - state: false
              duration: 1500ms

      - strobe:
          name: "HA Disconnected"
          colors:
            - state: true
              duration: 300ms
            - state: false
              duration: 700ms

web_server:
  port: 80
  version: 2
  log: false

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_sensor
    update_interval: 30s

  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s

  - platform: template
    name: "Free Heap Memory"
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
    unit_of_measurement: "bytes"
    update_interval: 60s
    entity_category: diagnostic

# The climate entity shows the state the Master Controller last commanded (or, with the Master Controller off and the
# wired remote connected, a best-effort view of what the bus shows). In HA's Auto mode the climate card hides the
# target temperature, so this number shows and sets it in every mode.
number:
  - platform: template
    name: "Set Temperature"
    id: fujitsu_set_temperature
    icon: "mdi:thermometer"
    entity_category: diagnostic
    min_value: 16
    max_value: 30
    step: 1
    update_interval: 5s
    lambda: |-
      if (std::isnan(id(fujitsu_hp).target_temperature))
        return {};
      return id(fujitsu_hp).target_temperature;
    set_action:
      - lambda: |-
          id(fujitsu_hp).make_call().set_target_temperature(x).perform();

# Mode, fan speed and Economy Mode as separate entities, because the ESPHome web UI's climate row does not give a usable
# control for them. In Home Assistant use the climate entity itself (a Thermostat card). This unit has fan
# Auto/Low/Medium/High (no Quiet).
select:
  # Mode, for the web UI. Commands only go to the unit while the Master Controller switch is on.
  - platform: template
    name: "Mode"
    id: fujitsu_mode
    icon: "mdi:air-conditioner"
    update_interval: 5s
    options:
      - "Off"
      - "Auto"
      - "Cool"
      - "Heat"
      - "Fan Only"
    lambda: |-
      switch (id(fujitsu_hp).mode) {
        case climate::CLIMATE_MODE_OFF: return std::string("Off");
        case climate::CLIMATE_MODE_AUTO: return std::string("Auto");
        case climate::CLIMATE_MODE_COOL: return std::string("Cool");
        case climate::CLIMATE_MODE_HEAT: return std::string("Heat");
        case climate::CLIMATE_MODE_FAN_ONLY: return std::string("Fan Only");
        default: return {};
      }
    set_action:
      - lambda: |-
          climate::ClimateMode m = climate::CLIMATE_MODE_OFF;
          if (x == "Auto") m = climate::CLIMATE_MODE_AUTO;
          else if (x == "Cool") m = climate::CLIMATE_MODE_COOL;
          else if (x == "Heat") m = climate::CLIMATE_MODE_HEAT;
          else if (x == "Fan Only") m = climate::CLIMATE_MODE_FAN_ONLY;
          id(fujitsu_hp).make_call().set_mode(m).perform();

  - platform: template
    name: "Fan Speed"
    id: fujitsu_fan_speed
    icon: "mdi:fan"
    update_interval: 5s
    options:
      - "Auto"
      - "Low"
      - "Medium"
      - "High"
    lambda: |-
      if (!id(fujitsu_hp).fan_mode.has_value())
        return {};
      switch (id(fujitsu_hp).fan_mode.value()) {
        case climate::CLIMATE_FAN_AUTO: return std::string("Auto");
        case climate::CLIMATE_FAN_LOW: return std::string("Low");
        case climate::CLIMATE_FAN_MEDIUM: return std::string("Medium");
        case climate::CLIMATE_FAN_HIGH: return std::string("High");
        default: return {};
      }
    set_action:
      - lambda: |-
          climate::ClimateFanMode m = climate::CLIMATE_FAN_AUTO;
          if (x == "Low") m = climate::CLIMATE_FAN_LOW;
          else if (x == "Medium") m = climate::CLIMATE_FAN_MEDIUM;
          else if (x == "High") m = climate::CLIMATE_FAN_HIGH;
          id(fujitsu_hp).make_call().set_fan_mode(m).perform();

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
    ssid:
      name: "WiFi SSID"
    mac_address:
      name: "MAC Address"

  - platform: version
    name: "ESPHome Version"

  # Master Controller state: Off, Checking bus, Running, or why it refused / stopped.
  - platform: template
    name: "Master Controller Status"
    id: master_controller_status
    icon: "mdi:remote"
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      return id(fujitsu_hp)->master_controller_status();

  # Bus OK / No Signal / Never Seen, from the recognised messages on the bus.
  - platform: template
    name: "Bus Status"
    id: bus_status
    icon: "mdi:swap-horizontal"
    entity_category: diagnostic
    update_interval: 2s
    lambda: |-
      return id(fujitsu_hp)->bus_status();

  - platform: template
    name: "GitHub Repository"
    icon: "mdi:github"
    entity_category: diagnostic
    lambda: |-
      return std::string("https://github.com/matt-nz/Retro-Fujitsu-ESPHome");

  # What the status LED is currently showing.
  - platform: template
    name: "Status LED Pattern"
    icon: "mdi:led-outline"
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return id(status_light).get_effect_name();

binary_sensor:
  - platform: status
    name: "Status"
    id: system_status

  - platform: template
    name: "Bus Alive"
    id: bus_alive
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(fujitsu_hp)->bus_alive();

  # The run flag in the unit's own replies; unknown until the unit has answered a poll.
  - platform: template
    name: "Unit Running"
    id: unit_running
    device_class: running
    lambda: |-
      const int state = id(fujitsu_hp)->unit_run_state();
      if (state < 0) return {};
      return state == 1;

switch:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

  # EXPERIMENTAL. The ESP takes over the wired remote's role: it polls the unit continuously and the climate entity's
  # commands (mode, setpoint, fan, ECO preset, off) become remote messages. The wired remote must be FULLY
  # disconnected (all three wires). The unit shuts down when polling stops, so turning this off also turns the unit
  # off. It refuses to start if it hears a wired remote or the bus is held low, and stops itself if a remote appears
  # or a transmission fails; "Master Controller Status" says why and the switch turns itself off (see the interval
  # below). Remembered across reboots so a power cut does not leave the unit unpolled.
  - platform: template
    name: "Master Controller"
    id: master_controller
    icon: "mdi:remote"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(fujitsu_hp)->set_master_controller(true);'
    turn_off_action:
      - lambda: 'id(fujitsu_hp)->set_master_controller(false);'

  - platform: template
    name: "Economy Mode"
    id: fujitsu_economy_mode
    icon: "mdi:leaf"
    lambda: |-
      return id(fujitsu_hp).preset == climate::CLIMATE_PRESET_ECO;
    turn_on_action:
      - lambda: |-
          id(fujitsu_hp).make_call().set_preset(climate::CLIMATE_PRESET_ECO).perform();
    turn_off_action:
      - lambda: |-
          id(fujitsu_hp).make_call().set_preset(climate::CLIMATE_PRESET_NONE).perform();

interval:
  # Keep the Master Controller switch in step with the firmware (it turns itself off on a refusal or a fault).
  - interval: 1s
    then:
      - lambda: |-
          const bool active = id(fujitsu_hp)->master_controller_active();
          if (id(master_controller).state != active) {
            id(master_controller).publish_state(active);
          }
  - interval: 300s
    then:
      - logger.log:
          format: "Status - WiFi: %.0f dBm, Uptime: %.1f hrs, Heap: %d bytes"
          args:
            - 'id(wifi_signal_sensor).state'
            - 'id(uptime_sensor).state / 3600.0'
            - 'heap_caps_get_free_size(MALLOC_CAP_INTERNAL)'
